<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>Hobbies and Interests Test</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=Caveat:wght@600;700&display=swap">
<style>
html{-webkit-text-size-adjust:100%}body{margin:0}[hidden]{display:none!important}
/* Layout: a hobby "passport" on sketchbook grid paper — 4 stamps track the tasks, one focused column of cards, sticky action bar */
:root{
  --bg:#EDF0F6; --grid:rgba(48,71,224,.07); --surface:#FFFFFF; --surface-2:#F6F7FB;
  --ink:#16203A; --muted:#5B6684; --line:#D6DCE9;
  --accent:#3047E0; --accent-ink:#FFFFFF; --accent-soft:#E7EBFF;
  --sun:#FFC83D; --sun-ink:#3A2A00; --coral:#FF7A59;
  --good:#16935F; --good-soft:#E3F6EC; --bad:#D63A50; --bad-soft:#FDE8EB;
  --shadow:0 1px 2px rgba(22,32,58,.06),0 8px 24px rgba(22,32,58,.07);
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-hand:"Caveat","Comic Sans MS",cursive;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1424; --grid:rgba(124,140,255,.07); --surface:#182037; --surface-2:#1E2742;
  --ink:#E8ECF7; --muted:#9AA5C4; --line:#2B3555;
  --accent:#8091FF; --accent-ink:#0F1424; --accent-soft:#252F57;
  --sun:#FFC83D; --sun-ink:#3A2A00; --coral:#FF8C6E;
  --good:#3CCB8F; --good-soft:#163527; --bad:#FF6B7D; --bad-soft:#3A1C24;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1424; --grid:rgba(124,140,255,.07); --surface:#182037; --surface-2:#1E2742;
  --ink:#E8ECF7; --muted:#9AA5C4; --line:#2B3555;
  --accent:#8091FF; --accent-ink:#0F1424; --accent-soft:#252F57;
  --sun:#FFC83D; --sun-ink:#3A2A00; --coral:#FF8C6E;
  --good:#3CCB8F; --good-soft:#163527; --bad:#FF6B7D; --bad-soft:#3A1C24;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input{-webkit-user-select:text;user-select:text}
.wrap{max-width:820px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.1}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}

/* top bar with stamps */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.brand{display:flex;flex-direction:column;gap:2px}
.brand b{font-family:var(--f-display);font-size:18px;letter-spacing:-.01em}
.brand span{font-size:13px;color:var(--muted)}
.stamps{display:flex;gap:10px}
.stamp{width:56px;height:56px;border-radius:50%;border:2px dashed var(--line);display:grid;place-items:center;
  color:var(--muted);background:var(--surface);position:relative;transition:transform .3s}
.stamp svg{width:22px;height:22px}
.stamp small{position:absolute;bottom:-17px;font-size:10px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;color:var(--muted)}
.stamp.cur{border:2px solid var(--accent);color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.stamp.done{border:2px solid var(--accent);background:var(--accent);color:var(--accent-ink);transform:rotate(-8deg)}
.stamp.done.pop{animation:stampin .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes stampin{0%{transform:scale(1.6) rotate(-20deg);opacity:.2}100%{transform:scale(1) rotate(-8deg);opacity:1}}

.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}

/* welcome */
.hero{padding:28px 24px 24px;position:relative;overflow:hidden}
.tag{display:inline-block;font-family:var(--f-hand);font-size:22px;color:var(--coral);transform:rotate(-3deg);margin-bottom:6px}
.hero h1{font-size:clamp(38px,8vw,64px);font-weight:800;letter-spacing:-.03em}
.hl{background:linear-gradient(transparent 58%,var(--sun) 58%,var(--sun) 90%,transparent 90%);color:inherit;padding:0 4px}
.hero p.lead{color:var(--muted);max-width:60ch;margin:14px 0 0;font-size:17px}
.stickers{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.sticker{font-size:13px;font-weight:600;padding:5px 12px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}
.sticker:nth-child(3n+1){transform:rotate(-2deg)}.sticker:nth-child(3n+2){transform:rotate(1.5deg)}
.grid2{display:grid;grid-template-columns:1.15fr 1fr;gap:16px;margin-top:16px}
@media (max-width:700px){.grid2{grid-template-columns:1fr}}
.rules{padding:22px}
.rules h2,.reg h2{font-size:20px;margin-bottom:12px}
.rules ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.rules li{display:grid;grid-template-columns:26px 1fr;gap:8px;font-size:15px}
.rules li i{font-style:normal;width:24px;height:24px;border-radius:7px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:13px}
.plan{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:16px}
.plan div{background:var(--surface-2);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--muted)}
.plan b{display:block;color:var(--ink);font-size:14px}
.reg{padding:22px;display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.field input{font:inherit;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface-2);color:var(--ink)}
.field input:focus{border-color:var(--accent);outline:none;background:var(--surface)}
.err{color:var(--bad);font-size:14px;min-height:1.2em;margin:0}
.btn{border:none;border-radius:12px;padding:13px 20px;font-weight:700;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s,opacity .15s}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.primary:hover:not(:disabled){transform:translateY(-1px)}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.sun{background:var(--sun);color:var(--sun-ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.note{font-size:13px;color:var(--muted);margin:0}

/* task head */
.thead{padding:22px 24px;display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.thead h2{font-size:clamp(24px,4.5vw,32px);font-weight:800;letter-spacing:-.02em}
.thead p{margin:0;color:var(--muted)}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.chip{font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}

/* MC questions */
.qs{display:flex;flex-direction:column;gap:12px}
.q{padding:18px 18px 16px;display:grid;grid-template-columns:36px 1fr;gap:12px;transition:border-color .2s}
.q.answered{border-color:color-mix(in srgb,var(--accent) 35%,var(--line))}
.qn{width:34px;height:34px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.q.answered .qn{background:var(--accent);color:var(--accent-ink)}
.qt{margin:4px 0 12px;font-size:16.5px;min-width:0}
.blank{display:inline-block;min-width:3.2em;border-bottom:2px dashed var(--accent);margin:0 2px;transform:translateY(-3px)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:560px){.opts{grid-template-columns:1fr}.q{grid-template-columns:1fr}.qn{width:30px;height:30px}}
.opt{display:flex;align-items:center;gap:10px;text-align:left;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-size:15px;transition:border-color .15s,background .15s}
.opt:hover{border-color:color-mix(in srgb,var(--accent) 55%,var(--line))}
.opt .l{flex:none;width:26px;height:26px;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;font-weight:700;font-size:13px;color:var(--muted)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .l{background:var(--accent);color:var(--accent-ink)}
.opt.sel .l{animation:pop .25s ease}
@keyframes pop{50%{transform:scale(1.18)}}

/* reading */
.reading{display:grid;grid-template-columns:250px 1fr;gap:16px;align-items:start}
@media (max-width:760px){.reading{grid-template-columns:1fr}}
.heads{padding:16px;position:sticky;top:12px}
@media (max-width:760px){.heads{position:static}}
.heads h3{font-size:15px;margin-bottom:10px}
.heads ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.heads li{display:grid;grid-template-columns:24px 1fr;gap:8px;font-size:14px;line-height:1.35;padding:6px 8px;border-radius:9px;transition:opacity .2s}
.heads li b{font-family:var(--f-display);color:var(--accent)}
.heads li.used{opacity:.4;text-decoration:line-through}
.text h3.tt{font-size:24px;margin:2px 0 12px}
.para{padding:18px;margin-bottom:12px;display:flex;flex-direction:column;gap:12px}
.para p{margin:0;max-width:68ch}
.pl{font-family:var(--f-display);font-weight:800;font-size:22px;color:var(--accent);float:left;margin:-2px 10px 0 0;line-height:1}
.pick{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-top:12px;border-top:1px dashed var(--line)}
.pick label{font-size:13px;font-weight:600;color:var(--muted)}
.pick select{font:inherit;font-size:15px;flex:1;min-width:0;max-width:100%;padding:10px 12px;border-radius:11px;border:1.5px solid var(--line);background:var(--surface-2);color:var(--ink)}
.pick select.set{border-color:var(--accent);background:var(--accent-soft)}
details.src{margin-bottom:16px}
details.src summary{padding:16px 20px;font-weight:700;cursor:pointer;font-family:var(--f-display);font-size:17px}
details.src .inner{padding:0 20px 18px;display:flex;flex-direction:column;gap:10px}
details.src .inner p{margin:0;font-size:15px;max-width:70ch}
.tf{padding:16px 18px;display:grid;grid-template-columns:36px 1fr auto;gap:12px;align-items:center}
@media (max-width:560px){.tf{grid-template-columns:30px 1fr}.tfb{grid-column:1/-1}}
.tf p{margin:0;min-width:0}
.tfb{display:flex;gap:6px}
.tfb button{min-width:84px;padding:9px 14px;border-radius:11px;border:1.5px solid var(--line);background:var(--surface);font-weight:700}
.tfb button.sel[data-v="T"]{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.tfb button.sel[data-v="F"]{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.tf.answered .qn{background:var(--accent);color:var(--accent-ink)}

/* sticky action bar */
.bar{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px));margin-top:18px;padding:12px 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.prog{flex:1;min-width:160px;display:flex;flex-direction:column;gap:6px}
.prog span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.track{height:8px;border-radius:9px;background:var(--surface-2);overflow:hidden}
.track i{display:block;height:100%;background:var(--accent);border-radius:9px;transition:width .3s}
.bar .btns{display:flex;gap:8px;margin-left:auto}

/* results */
.res-hero{padding:26px 24px;display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center}
@media (max-width:560px){.res-hero{grid-template-columns:1fr}}
.res-hero h2{font-size:clamp(28px,6vw,40px);font-weight:800;letter-spacing:-.02em}
.res-hero p{margin:8px 0 0;color:var(--muted)}
.disc{width:150px;height:150px;border-radius:50%;background:var(--sun);color:var(--sun-ink);display:grid;place-items:center;text-align:center;transform:rotate(-6deg);
  box-shadow:inset 0 0 0 6px color-mix(in srgb,var(--sun-ink) 12%,transparent)}
.disc b{display:block;font-family:var(--f-display);font-size:62px;line-height:.9;font-weight:800;font-variant-numeric:tabular-nums}
.disc span{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.formula{font-size:14px;color:var(--muted);margin-top:10px;font-variant-numeric:tabular-nums}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}
@media (max-width:640px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tile{padding:14px;display:flex;flex-direction:column;gap:4px}
.tile small{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tile b{font-family:var(--f-display);font-size:30px;font-variant-numeric:tabular-nums}
.tile b em{font-style:normal;font-size:16px;color:var(--muted)}
.tile span{font-size:13px;color:var(--muted)}
.save{padding:18px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;border:2px dashed var(--accent);background:var(--accent-soft);box-shadow:none}
.save div{flex:1;min-width:220px}
.save p{margin:4px 0 0;font-size:14px;color:var(--muted)}
.save h3{font-size:18px}
.ans{margin-top:18px;padding:18px 20px}
.ans h3{font-size:18px;margin-bottom:6px}
.ans h4{font-family:var(--f-display);font-size:15px;margin:18px 0 8px;color:var(--accent)}
.row{display:grid;grid-template-columns:22px 1fr;gap:8px;font-size:13.5px;padding:8px 0;border-top:1px solid var(--line)}
.row .mk{font-weight:800}
.row.ok .mk{color:var(--good)}.row.no .mk{color:var(--bad)}
.row p{margin:0;min-width:0}
.row .a{display:block;margin-top:2px;color:var(--muted)}
.row .a b.g{color:var(--good)}.row .a b.r{color:var(--bad)}
.banner{padding:12px 16px;border-radius:12px;background:var(--sun);color:var(--sun-ink);font-weight:600;font-size:14px;margin-bottom:14px}

/* modal + toast */
.modal{position:fixed;inset:0;background:rgba(10,14,28,.5);display:grid;place-items:center;padding:16px;z-index:50}
.modal .card{max-width:420px;padding:24px;display:flex;flex-direction:column;gap:12px}
.modal h3{font-size:22px}
.modal p{margin:0;color:var(--muted)}
.modal .btns{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;z-index:60;max-width:calc(100% - 32px)}
.spin{width:16px;height:16px;border:2.5px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.fade{animation:fade .35s ease}
@keyframes fade{from{opacity:.0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* off-screen PDF pages (always white paper) */
#report{position:fixed;left:-12000px;top:0}
.pg{width:794px;height:1123px;background:#fff;color:#16203A;font-family:var(--f-body);padding:52px 56px 40px;display:flex;flex-direction:column}
.pg .pc{flex:1;overflow:hidden;display:flex;flex-direction:column;gap:0}
.pg .pf{font-size:11px;color:#7A84A0;display:flex;justify-content:space-between;border-top:1px solid #DDE2EE;padding-top:8px}
.r-h{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;padding-bottom:16px;border-bottom:3px solid #3047E0;margin-bottom:14px}
.r-h h1{font-family:var(--f-display);font-size:28px;color:#16203A}
.r-h p{margin:4px 0 0;font-size:13px;color:#5B6684}
.r-g{background:#FFC83D;color:#3A2A00;border-radius:14px;padding:10px 18px;text-align:center}
.r-g b{display:block;font-family:var(--f-display);font-size:40px;line-height:1}
.r-g span{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.r-t{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:10px}
.r-t td,.r-t th{border:1px solid #DDE2EE;padding:6px 8px;text-align:left}
.r-t th{background:#F1F3F9}
.r-sec{font-family:var(--f-display);font-size:15px;font-weight:700;color:#3047E0;margin:12px 0 4px}
.r-row{display:grid;grid-template-columns:20px 1fr;gap:6px;font-size:12px;line-height:1.4;padding:5px 0;border-top:1px solid #EEF0F6}
.r-row .mk{font-weight:800}
.r-row.ok .mk{color:#16935F}.r-row.no .mk{color:#D63A50}
.r-row .a{color:#5B6684}
.r-row .a b.g{color:#16935F}.r-row .a b.r{color:#D63A50}
</style>

<div class="wrap" id="app">
  <header class="topbar">
    <div class="brand"><b>Hobbies &amp; Interests</b><span>Діагностувальна робота · 11 клас</span></div>
    <div class="stamps" id="stamps" aria-label="Прогрес"></div>
  </header>
  <main id="main"></main>
</div>
<div id="report" aria-hidden="true"></div>
<div id="layer"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
(function(){
"use strict";

/* ---------------- content ---------------- */
const T1 = [
 {q:`My grandfather has more than 500 old coins from different countries. ___ has been his hobby for forty years.`, o:[`Pottery`,`Numismatics`,`Carving`,`Weaving`]},
 {q:`She bought a big glass tank, some colourful fish and water plants. Keeping ___ is her new hobby.`, o:[`aquariums`,`artifacts`,`board games`,`model airplanes`]},
 {q:`The Japanese art of arranging flowers in a vase is called ___.`, o:[`origami`,`macrame`,`ikebana`,`quilting`]},
 {q:`In ___, people fold a single sheet of paper into shapes such as birds, boxes and flowers.`, o:[`pottery`,`embroidery`,`knitting`,`origami`]},
 {q:`My aunt makes beautiful bowls and vases from clay on a special wheel. She's really into ___.`, o:[`pottery`,`sewing`,`carpentry`,`knitting`]},
 {q:`___ means decorating cloth with pictures or patterns sewn with coloured threads.`, o:[`Weaving`,`Carving`,`Embroidery`,`Origami`]},
 {q:`Jumping out of a plane and opening a parachute high above the ground: ___ is not for the faint-hearted.`, o:[`yachting`,`surfing`,`kite flying`,`skydiving`]},
 {q:`If you want to watch rare birds without disturbing them, take binoculars and go ___ early in the morning.`, o:[`hunting`,`bird-watching`,`fishing`,`jogging`]},
 {q:`To explore coral reefs deep under the water, breathing from a tank of air, you need to learn ___.`, o:[`scuba diving`,`boating`,`surfing`,`yachting`]},
 {q:`I've decided to ___ yoga because I need a new hobby. My first class is on Monday!`, o:[`give up`,`stick at`,`take up`,`put off`]},
 {q:`Learning the guitar is hard at first, but if you ___ it, you'll be playing your favourite songs in a few months.`, o:[`stick at`,`give up`,`take part in`,`put off`]},
 {q:`More than 200 runners ___ the charity race last Sunday, and all of them reached the finish line.`, o:[`gave up`,`took part in`,`stuck at`,`took up`]},
 {q:`Registration is open until Friday, so you can ___ the photography course on the school website.`, o:[`pick up`,`give up`,`sign up for`,`stick at`]},
 {q:`He got bored with chess after a few months, so he decided to ___ it and try something more active.`, o:[`take part in`,`sign up for`,`stick at`,`give up`]},
 {q:`I never took any lessons. I just ___ a few Spanish words while travelling around Spain.`, o:[`took up`,`picked up`,`signed up for`,`gave up`]}
];
const T2 = [

/* ---------------- scoring ---------------- */
function correctOf(i, qi){
  if(i === 0) return L.indexOf(KEY[1][qi]);
  if(i === 1) return L.indexOf(KEY[2][qi]);
  if(i === 2) return KEY[3][qi];
  return KEY[4][qi];
}
function computeScores(){
  const per = TASKS.map((t,i) => { let c = 0; t.items.forEach((_,qi) => { if(state.answers[i][qi] === correctOf(i,qi)) c++; });
    return {correct:c, total:t.items.length, score:round(c*11/t.items.length)}; });
  const avg = per.reduce((s,p) => s + p.score, 0) / per.length;
  return {per, avg, grade:round(avg)};
}
async function finish(){
  const r = computeScores();
  state.status = "finished"; state.finishedAt = new Date().toISOString();
  state.scores = r.per; state.avg = r.avg; state.grade = r.grade;
  await saveAttempt(true);
  renderResult(false);
}

      else if(t.kind === "head"){ q = `Paragraph ${it.l}`; your = a===null?"—":`${a}. ${esc(HEADINGS[a-1])}`; right = `${c}. ${esc(HEADINGS[c-1])}`; }
      else { q = esc(it); const w = v => v==="T"?"True":v==="F"?"False":"—"; your = w(a); right = w(c); }
      return `<div class="${cls} ${ok?"ok":"no"}"><span class="mk">${ok?"✓":"✗"}</span><p>${qi+1}. ${q}<span class="a">Відповідь: <b class="${ok?"g":"r"}">${your}</b>${ok?"":` · Правильно: <b class="g">${right}</b>`}</span></p></div>`;
    }).join("");
    return {title:`Task ${t.n}. ${t.title} — ${state.scores[i].score}/11 (${state.scores[i].correct} з ${state.scores[i].total})`, rows};
  });
}
function formula(){ return `Середнє: (${state.scores.map(s=>s.score).join(" + ")}) / 4 = ${fmt(state.avg)} → ${state.grade}`; }
function renderResult(returning){
  renderStamps(4, true);
  const name = esc(state.first);
  const g = state.grade;
  const msg = g >= 10 ? "Чудовий результат!" : g >= 7 ? "Гарна робота!" : g >= 4 ? "Непогано, є над чим попрацювати." : "Варто повторити тему.";
  $("#main").innerHTML = `
  ${returning ? `<div class="banner fade">Ви вже проходили цей тест з пошти ${esc(state.email)}. Повторна спроба неможлива, але ви можете ще раз зберегти PDF.</div>` : ""}
  <section class="card res-hero fade">
    <div><span class="eyebrow">Результат</span><h2>${msg} ${name}, ваша оцінка:</h2>
    <p>${esc(state.first)} ${esc(state.last)} · ${esc(state.email)}</p><p class="formula">${formula()}</p></div>
    <div class="disc"><div><b>${g}</b><span>з 11</span></div></div>
  </section>
  <div class="tiles">${TASKS.map((t,i)=>`<div class="card tile"><small>Task ${t.n} · ${t.short}</small><b>${state.scores[i].score}<em> / 11</em></b><span>${state.scores[i].correct} з ${state.scores[i].total} правильно</span></div>`).join("")}</div>
  <section class="card save">
    <div><h3>Збережіть PDF для Google Classroom</h3><p>У файлі будуть ваше ім'я, оцінки та всі відповіді. Прикріпіть його до завдання в Classroom.</p></div>
    <button class="btn primary" id="pdfbtn" type="button">Зберегти PDF</button>
  </section>
  <section class="card ans"><h3>Ваші відповіді</h3>${answerRows("row").map(b=>`<h4>${esc(b.title)}</h4>${b.rows}`).join("")}</section>`;
  $("#main").onclick = null; $("#main").onchange = null;
  $("#pdfbtn").onclick = makePdf;
  window.scrollTo(0,0);
}

/* ---------------- PDF ---------------- */
function buildReport(){
  const rep = $("#report"); rep.innerHTML = "";
  const when = new Date(state.finishedAt || Date.now()).toLocaleString("uk-UA");
  const blocks = [];
  blocks.push(`<div class="r-h"><div><h1>Hobbies and Interests</h1><p>Діагностувальна робота · 11 клас</p><p><b>${esc(state.first)} ${esc(state.last)}</b> · ${esc(state.email)}</p><p>Завершено: ${esc(when)}</p></div><div class="r-g"><b>${state.grade}</b><span>з 11</span></div></div>`);
  blocks.push(`<table class="r-t"><tr><th>Завдання</th><th>Правильно</th><th>Бали</th></tr>${TASKS.map((t,i)=>`<tr><td>Task ${t.n}. ${esc(t.title)}</td><td>${state.scores[i].correct} з ${state.scores[i].total}</td><td><b>${state.scores[i].score} / 11</b></td></tr>`).join("")}<tr><th colspan="2">${formula()}</th><th>${state.grade} / 11</th></tr></table>`);
  answerRows("r-row").forEach(b => {
    blocks.push(`<div class="r-sec">${esc(b.title)}</div>`);
    const tmp = document.createElement("div"); tmp.innerHTML = b.rows;
    [...tmp.children].forEach(c => blocks.push(c.outerHTML));
  });
  const pages = [];
  let pc = null;
  const newPage = () => { const pg = document.createElement("div"); pg.className = "pg";
    pg.innerHTML = `<div class="pc"></div><div class="pf"><span>${esc(state.first)} ${esc(state.last)} · Hobbies and Interests</span><span class="pn"></span></div>`;
    rep.appendChild(pg); pages.push(pg); pc = pg.querySelector(".pc"); };
  newPage();
  blocks.forEach((h, bi) => {
    pc.insertAdjacentHTML("beforeend", h);
    if(pc.scrollHeight > pc.clientHeight + 1 && pc.children.length > 1){
      const el = pc.lastElementChild; el.remove();
      // keep a section title with its first row
      const prev = pc.lastElementChild; let carry = null;
      if(prev && prev.classList.contains("r-sec")){ carry = prev; prev.remove(); }
      newPage(); if(carry) pc.appendChild(carry); pc.appendChild(el);
    }
  });
  pages.forEach((p,i) => p.querySelector(".pn").textContent = `стор. ${i+1} з ${pages.length}`);
  return pages;
}
async function makePdf(){
  const b = $("#pdfbtn"); const label = b.innerHTML;
  b.disabled = true; b.innerHTML = `<span class="spin"></span> Готуємо PDF…`;
  try{
    if(!window.jspdf || !window.html2canvas) throw {code:"nolib"};
    try{ await document.fonts.ready; }catch(e){}
    const pages = buildReport();
    const pdf = new window.jspdf.jsPDF({unit:"mm", format:"a4", orientation:"p"});
    for(let i=0;i<pages.length;i++){
      const c = await window.html2canvas(pages[i], {scale:2, backgroundColor:"#ffffff", logging:false});
      if(i) pdf.addPage();
      pdf.addImage(c.toDataURL("image/jpeg", 0.9), "JPEG", 0, 0, 210, 297);
    }
    const blob = pdf.output("blob");
    $("#report").innerHTML = "";
    const safe = s => s.replace(/[\\/:*?"<>|]+/g, "").trim();
    const fname = `Hobbies_${safe(state.last)}_${safe(state.first)}.pdf`;
    const dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null;
    if(dl) await dl.save({filename:fname, data:blob});
    else pdf.save(fname);
    toast("PDF збережено. Прикріпіть його в Google Classroom.", 3500);
  }catch(e){
    const c = e && e.code;
    if(c === "declined") toast("Збереження скасовано. Натисніть кнопку ще раз, коли будете готові.", 3500);
    else if(c === "rate_limited") toast("Зачекайте кілька секунд і спробуйте ще раз.", 3000);
    else toast("Не вдалося зберегти PDF у цьому вікні. Зробіть скріншот результату або відкрийте тест у браузері на комп'ютері.", 5000);
  }finally{ b.disabled = false; b.innerHTML = label; }
}

renderWelcome();
})();
</script>
